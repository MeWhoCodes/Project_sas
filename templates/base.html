<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f4f4">
    <title>{% block title %}Student Attendance System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-mark">A</span>
            <span>Student Attendance System</span>
        </a>
        {% if request.session.get("role") %}
        <nav class="nav-user">
            <span class="user-greeting">{{ request.session.get("name") }}</span>
            <form action="/logout" method="post">
                <button class="text-button" type="submit">Sign out</button>
            </form>
        </nav>
        {% else %}
        <a class="nav-back" href="/">Home</a>
        {% endif %}
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='js/app.js') }}?v=weekdays-2" defer></script>
</body>
</html>
